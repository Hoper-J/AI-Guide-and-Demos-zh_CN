<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5eb">
  <title>鹈鹕的兜风日 · Pelican Cycling Club</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #faf8f0; --sky: #f1f3e8; --ink: #304b43; --muted: #667970;
      --line: #d5dcd0; --accent: #c85c3e; --accent-hover: #ae492f;
      --water: #bed9cb; --water-line: #89b8a7; --island: #b0c6ac;
      --sand: #e9e5ca; --road: #e0debf; --road-line: #f7f4df;
      --grass: #7a9875; --grass-dark: #58775f; --sun: #e7b56c; --cloud: #fffdf5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
    body[data-time="sunset"] { --paper:#f6ece0; --sky:#f0d9ca; --line:#d9c5b6; --water:#a8c3bc; --water-line:#7ca99e; --island:#aab79c; --sand:#e5ceb0; --road:#d9bd9b; --road-line:#f6e3c8; --grass:#81906b; --grass-dark:#5c755e; --sun:#d77a51; --cloud:#fae9d7; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    button { cursor: pointer; }
    button svg { width: 19px; height: 19px; flex: none; stroke: currentColor; stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .page { min-height: 100svh; display: flex; flex-direction: column; }
    .masthead { height: 86px; padding: 0 4.4%; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark { width: 43px; height: 43px; }
    .brand-name { font-size: 15px; letter-spacing: .12em; font-weight: 650; }
    .brand-sub { margin-top: 5px; font-size: 9px; letter-spacing: .19em; font-weight: 550; }
    .time-button { min-height: 44px; background: transparent; border: 1px solid var(--line); border-radius: 30px; padding: 0 16px; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; font-size: 12px; transition: background .2s, border-color .2s; }
    .time-button:hover { background: var(--sky); border-color: var(--muted); }
    .stage { position: relative; height: calc(100svh - 242px); min-height: 465px; max-height: 780px; background: var(--sky); overflow: hidden; }
    .intro { position: absolute; z-index: 2; left: 5.1%; top: 40px; pointer-events: none; }
    .eyebrow { display: flex; align-items: center; gap: 10px; font-size: 10px; font-weight: 550; letter-spacing: .16em; }
    .eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--accent); }
    h1 { margin: 18px 0 15px; font-family: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif; font-size: clamp(32px, 3.5vw, 54px); line-height: 1.32; font-weight: 500; letter-spacing: .03em; }
    .intro p { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .1em; }
    #scene { display: block; width: 100%; height: 100%; overflow: visible; }
    .sky { fill: var(--sky); }
    .water { fill: var(--water); }
    .water-line { stroke: var(--water-line); }
    .sand { fill: var(--sand); }
    .road { fill: var(--road); }
    .grass { fill: var(--grass); }
    .grass-stroke { stroke: var(--grass); }
    .grass-dark { fill: var(--grass-dark); }
    .cloud { fill: var(--cloud); }
    .island { fill: var(--island); }
    .sun { fill: var(--sun); }
    .road-line { stroke: var(--road-line); }
    #pelican { cursor: pointer; }
    .scene-note { position: absolute; left: 5.1%; bottom: 21px; font-size: 10px; letter-spacing: .12em; color: #536650; display: flex; align-items: center; gap: 9px; }
    .scene-note span { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .scene-message { position: absolute; left: 57%; top: 20px; transform: translateX(-50%) translateY(5px); padding: 9px 16px; border-radius: 24px; background: var(--paper); color: var(--ink); font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; white-space: nowrap; }
    .scene-message.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .controls { width: 100%; max-width: 1160px; padding: 29px 38px 24px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 38px; }
    .play-button { border: 0; background: none; display: flex; align-items: center; padding: 0; gap: 13px; color: var(--ink); min-height: 50px; min-width: 156px; text-align: left; }
    .play-circle { width: 49px; height: 49px; border-radius: 50%; background: var(--accent); color: #fff9ed; display: grid; place-items: center; transition: transform .2s, background .2s; }
    .play-button:hover .play-circle { transform: scale(1.06); background: var(--accent-hover); }
    .play-circle svg { width: 19px; height: 19px; stroke-width: 2; }
    .play-text { font-size: 14px; font-weight: 550; }
    .key-caption { display: block; margin-top: 5px; font-size: 10px; color: var(--muted); letter-spacing: .03em; }
    .speed-control { width: 280px; min-width: 160px; flex: 1; max-width: 330px; }
    .speed-label { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
    #speed-value { font-variant-numeric: tabular-nums; font-size: 12px; }
    input[type="range"] { --range-fill: 37.5%; appearance: none; -webkit-appearance: none; display: block; margin: 3px 0 0; padding: 0; width: 100%; height: 30px; background: linear-gradient(to right, var(--accent) 0 var(--range-fill), var(--line) var(--range-fill) 100%) center / 100% 5px no-repeat; cursor: pointer; touch-action: pan-y; }
    input[type="range"]::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 17px; height: 17px; border-radius: 50%; background: var(--paper); border: 4px solid var(--accent); }
    input[type="range"]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--paper); border: 4px solid var(--accent); }
    .actions { display: flex; align-items: center; gap: 10px; }
    .action-button { min-height: 47px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 9px; padding: 0 17px; font-size: 12px; white-space: nowrap; transition: border-color .2s, background .2s, transform .2s; }
    .action-button:hover { background: var(--sky); border-color: var(--muted); transform: translateY(-2px); }
    .action-button:active { transform: translateY(0); }
    .footer { max-width: 1084px; width: calc(100% - 76px); margin: 0 auto; padding: 13px 0 17px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 16px; color: var(--muted); font-size: 10px; letter-spacing: .03em; }
    .footer .tagline { font-family: Georgia, serif; font-style: italic; font-size: 12px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (min-width: 1700px) { .intro { left: calc(50% - 700px); } }
    @media (max-width: 850px) and (min-width: 641px) { .intro { top: 25px; } .intro p { max-width: 125px; line-height: 1.8; } h1 { font-size: 31px; } .controls { gap: 24px; padding-right: 28px; padding-left: 28px; } .play-button { min-width: 140px; } .action-button { padding: 0 12px; } }
    @media (max-width: 640px) {
      .masthead { height: 75px; padding: 0 22px; gap: 10px; }
      .brand-mark { width: 36px; height: 36px; }
      .brand { gap: 9px; }
      .brand-name { font-size: 13px; letter-spacing: .07em; }
      .brand-sub { font-size: 7px; letter-spacing: .12em; }
      .time-button { padding: 0 12px; font-size: 11px; gap: 6px; }
      .time-button svg { width: 16px; height: 16px; }
      .stage { min-height: 0; height: auto; max-height: none; padding-top: 146px; }
      .intro { top: 20px; left: 25px; }
      .eyebrow { font-size: 8px; letter-spacing: .12em; }
      h1 { font-size: 31px; margin: 10px 0 0; line-height: 1.3; }
      .intro p { display: none; }
      #scene { height: auto; aspect-ratio: 660 / 550; }
      .scene-note { left: 25px; bottom: 13px; font-size: 8px; }
      .scene-message { left: auto; right: 20px; top: 100px; transform: translateY(5px); font-size: 11px; padding: 7px 11px; }
      .scene-message.visible { transform: translateY(0); }
      .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 25px 24px; padding: 23px 25px; }
      .play-button { min-width: 0; gap: 10px; }
      .play-circle { width: 43px; height: 43px; }
      .play-text { font-size: 13px; }
      .key-caption { font-size: 9px; }
      .speed-control { width: 100%; min-width: 0; }
      .speed-label { font-size: 11px; }
      input[type="range"] { height: 44px; margin-top: 0; }
      .actions { grid-column: 1 / -1; gap: 12px; }
      .action-button { flex: 1; min-height: 45px; }
      .footer { width: calc(100% - 50px); padding: 13px 0 18px; font-size: 9px; }
      .footer .tagline { font-size: 11px; }
      .desktop-hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>

                <path d="m639 286 38 8-1 13-40-7Z" fill="#cf654b" stroke="#8f533d" stroke-width="2.5" stroke-linejoin="round"/><path d="m645 289 29 7" stroke="#f1a47f" stroke-width="2" stroke-linecap="round"/>
                <path d="M637 296q-11 2-7 11 11 6 17-6Z" fill="#d87654" stroke="#8f533d" stroke-width="2"/>
                <g id="pelican-head">
                  <path d="M714 226Q759 219 900 239 858 257 815 278 773 309 737 281 721 265 714 226Z" fill="#e8ae5e" stroke="#3b4d41" stroke-width="3.5" stroke-linejoin="round"/>
                  <path d="M726 244q33 52 78 30 38-17 74-29-53 37-81 47-43 12-64-24Z" fill="#d5924b" opacity=".68"/>
                  <path d="M745 255q10 14 28 17m-16-24q13 12 31 15" fill="none" stroke="#f5ca80" stroke-width="2" stroke-linecap="round" opacity=".8"/>
                  <path d="M716 218Q779 210 900 236q8 3 3 10l-9 6 1-10Q802 253 716 233Z" fill="#f1c36e" stroke="#364b43" stroke-width="3.2" stroke-linejoin="round"/>
                  <path d="M726 222q69-2 152 13" stroke="#ffe2a0" stroke-width="3" fill="none" stroke-linecap="round"/>
                  <path d="m752 228 8 1" stroke="#a87b3f" stroke-width="2.5" stroke-linecap="round"/>
                  <path d="M683 193q-4-12 4-20m8 14q-1-14 8-17" fill="none" stroke="#364b43" stroke-width="3" stroke-linecap="round"/>
                  <path d="M666 191q3-25 28-25 25 0 32 25l-15 6Z" fill="#709681" stroke="#364b43" stroke-width="3"/>
                  <path d="M688 171q17 4 20 20" fill="none" stroke="#abc2a2" stroke-width="2.5"/>
                  <path d="M660 189q30-3 65 1l20 7q-24 6-38 0l-42-2Z" fill="#6d927a" stroke="#364b43" stroke-width="3" stroke-linejoin="round"/>
                  <path d="m690 170 7-1" stroke="#364b43" stroke-width="3" stroke-linecap="round"/>
                  <ellipse cx="697" cy="211" rx="12" ry="12.5" fill="#eee5c9"/>
                  <g id="eye" transform="translate(700 209)"><ellipse rx="5" ry="6" fill="#2f453d"/><circle cx="1.6" cy="-2" r="1.6" fill="#fffbed"/></g>
                  <path d="M689 204q5-5 11-3" fill="none" stroke="#364b43" stroke-width="2" stroke-linecap="round"/>
                  <path d="M692 229q5 3 10 0" fill="none" stroke="#ddae87" stroke-width="3.5" stroke-linecap="round"/>
                </g>
                <g id="wing">
                  <path d="M544 323q22-19 49-6c22 11 41 23 68 23l96-4q21-1 30 10 3 5-4 7l-22-4q-1 7-8 6l-94 4c-24 17-53 22-80 11-20-8-30-22-35-47Z" fill="#efeedc" stroke="#364b43" stroke-width="3.5" stroke-linejoin="round"/>
                  <path d="M554 334q44 39 101 16m-99-6q41 39 81 17" fill="none" stroke="#bfc8b3" stroke-width="2.5" stroke-linecap="round"/>
                  <path d="m756 342 19 2m-22 4 13 1" fill="none" stroke="#82947e" stroke-width="2" stroke-linecap="round"/>
                </g>
              </g>
            </g>
            <g id="front-leg"><path id="front-leg-outline" d="M605 380 557 456 658 527" fill="none" stroke="#8a603c" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><path id="front-leg-color" d="M605 380 557 456 658 527" fill="none" stroke="#edb968" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><path id="leg-highlight" d="M559 456 653 523" fill="none" stroke="#f6d089" stroke-width="2" stroke-linecap="round"/></g>
            <circle cx="630" cy="527" r="27" fill="#d5d1b8" stroke="#46594b" stroke-width="3"/>
            <circle cx="630" cy="527" r="19" fill="none" stroke="#87917b" stroke-width="2" stroke-dasharray="4 5"/>
            <g id="crank"><path d="M-34 0H34" stroke="#46594b" stroke-width="7" stroke-linecap="round"/><path d="M-31-1H31" stroke="#d7ddc9" stroke-width="2" stroke-linecap="round"/></g>
            <circle cx="630" cy="527" r="5" fill="#43574a"/>
            <g id="front-foot" transform="translate(664 527)"><path d="m-7-7 19 1 17 11H-10Z" fill="#edb968" stroke="#8a603c" stroke-width="2.5" stroke-linejoin="round"/><path d="m5-3 6 6m2-5 8 6" fill="none" stroke="#be8b4d" stroke-width="1.5"/><path d="M-14 9H27" stroke="#405448" stroke-width="6" stroke-linecap="round"/><path d="M-9 8H22" stroke="#8e9a80" stroke-width="1.5" stroke-linecap="round"/></g>
            <g id="speed-strokes" fill="none" stroke="#8caa95" stroke-width="2" stroke-linecap="round" opacity=".4"><path d="M454 367h-35m18 17h-47m65 17h-24"/></g>
          </g>
        </svg>
        <div class="scene-note"><span></span>海边小路 · 好心情不限速</div>
        <div id="scene-message" class="scene-message" aria-hidden="true"></div>
      </section>

      <section class="controls" aria-label="骑行动画控制">
        <button id="play-button" class="play-button" type="button" aria-pressed="false" aria-label="暂停骑行">
          <span class="play-circle"><svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12"/></svg></span>
          <span><span id="play-label" class="play-text">歇一会儿</span><span class="key-caption">SPACE / 开始与暂停</span></span>
        </button>
        <div class="speed-control"><label class="speed-label" for="speed"><span>骑行速度</span><output id="speed-value" for="speed">1.0×</output></label><input type="range" id="speed" min="0.4" max="2" step="0.1" value="1" aria-valuetext="1.0 倍速度"></div>
        <div class="actions">
          <button type="button" id="bell-button" class="action-button" aria-label="按响车铃，快捷键 B"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15a7 7 0 0 1 14 0M3 17h18M12 6V3M9 21h6M18 7l2-2"/></svg>叮铃一下</button>
          <button type="button" id="jump-button" class="action-button" aria-label="让鹈鹕和自行车跳跃，快捷键 J"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M12 15V3m-5 5 5-5 5 5"/></svg>轻轻一跃</button>
        </div>
      </section>
    </main>
    <footer class="footer"><span>点击鹈鹕，也有小惊喜<span class="desktop-hint"> &nbsp; · &nbsp; B 按铃 / J 跳跃</span></span><span class="tagline">Life is better at bird speed.</span></footer>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
    <noscript><p style="padding:0 25px">请启用浏览器 JavaScript，即可播放骑行动画并使用互动按钮。</p></noscript>
  </div>
  <script>
    (() => {
      'use strict';
      const $ = (id) => document.getElementById(id);
      const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      const mobileQuery = window.matchMedia('(max-width: 640px)');
      const state = { paused: motionQuery.matches, speed: 1, distance: 0, time: 0, jumpStart: -Infinity, bellStart: -Infinity, sunset: false, reduced: motionQuery.matches };
      const el = Object.fromEntries(['scene', 'rider', 'rear-spokes', 'front-spokes', 'crank', 'bird-body', 'wing', 'scarf-ribbon', 'scarf-line', 'eye', 'front-leg-outline', 'front-leg-color', 'back-leg-outline', 'back-leg-color', 'leg-highlight', 'front-foot', 'back-foot', 'bike-shadow', 'road-lines', 'shore', 'distant-land', 'ripples', 'clouds', 'sky-birds', 'speed-strokes', 'bell-waves', 'bell-body', 'dust', 'play-button', 'play-icon', 'play-label', 'speed', 'speed-value', 'status', 'scene-message', 'sun-disc'].map(id => [id, $(id)]));
      let raf = null, lastFrame = null, messageTimer = null, audioContext = null;
      let themePosition = 0;
      const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
      const setTransform = (node, value) => node.setAttribute('transform', value);

      function say(message, show = true) {
        el.status.textContent = message;
        if (!show) return;
        clearTimeout(messageTimer);
        el['scene-message'].textContent = message;
        el['scene-message'].classList.add('visible');
        messageTimer = setTimeout(() => el['scene-message'].classList.remove('visible'), 1900);
      }

      function updatePlayback() {
        el['play-button'].setAttribute('aria-pressed', String(state.paused));
        el['play-button'].setAttribute('aria-label', state.paused ? '继续骑行' : '暂停骑行');
        el['play-label'].textContent = state.paused ? '继续骑行' : '歇一会儿';
        el['play-icon'].innerHTML = state.paused ? '<path d="m9 5 10 7-10 7Z" fill="currentColor" stroke="none"/>' : '<path d="M8 6v12M16 6v12"/>';
      }

      function ensureFrame() {
        if (raf === null && !document.hidden) { lastFrame = null; raf = requestAnimationFrame(frame); }
      }

      function togglePause() {
        state.paused = !state.paused;
        updatePlayback();
        say(state.paused ? '歇一会儿，听听海风。' : '出发，继续追风！');
        ensureFrame();
      }

      function knee(hip, foot, a = 96, b = 98) {
        const dx = foot.x - hip.x, dy = foot.y - hip.y;
        const d = clamp(Math.hypot(dx, dy), 1, a + b - .01);
        const along = (a * a - b * b + d * d) / (2 * d);
        const side = Math.sqrt(Math.max(0, a * a - along * along));
        return { x: hip.x + dx / d * along - dy / d * side, y: hip.y + dy / d * along + dx / d * side };
      }

      function drawLeg(prefix, hip, foot) {
        const joint = knee(hip, foot);
        const path = `M${hip.x.toFixed(2)} ${hip.y.toFixed(2)} L${joint.x.toFixed(2)} ${joint.y.toFixed(2)} L${foot.x.toFixed(2)} ${foot.y.toFixed(2)}`;
        el[`${prefix}-leg-outline`].setAttribute('d', path);
        el[`${prefix}-leg-color`].setAttribute('d', path);
        setTransform(el[`${prefix}-foot`], `translate(${foot.x.toFixed(2)} ${foot.y.toFixed(2)})`);
        if (prefix === 'front') el['leg-highlight'].setAttribute('d', `M${joint.x + 2} ${joint.y}L${foot.x} ${foot.y - 3}`);
      }

      function render(now, dt) {
        const d = state.distance;
        const phase = d / 86;
        const degrees = phase * 180 / Math.PI;
        const pedalPhase = phase * .92;
        const bob = Math.sin(pedalPhase * 2) * (state.reduced ? .5 : 2.3);
        const jumpProgress = clamp((now - state.jumpStart) / 1050, 0, 1);
        const airborne = jumpProgress < 1 ? Math.pow(Math.sin(Math.PI * jumpProgress), 1.15) : 0;
        const lift = airborne * (state.reduced ? 8 : 72);
        const tilt = airborne * Math.sin(jumpProgress * Math.PI * 1.8) * (state.reduced ? -.5 : -3.8);

        setTransform(el.rider, `translate(0 ${-lift}) rotate(${tilt} 655 533)`);
        setTransform(el['rear-spokes'], `rotate(${degrees})`);
        setTransform(el['front-spokes'], `rotate(${degrees})`);
        setTransform(el.crank, `translate(630 527) rotate(${pedalPhase * 180 / Math.PI})`);
        setTransform(el['bird-body'], `translate(0 ${bob})`);
        setTransform(el.wing, `rotate(${-airborne * (state.reduced ? 4 : 20)} 552 325)`);
        drawLeg('front', { x: 603, y: 382 + bob }, { x: 630 + Math.cos(pedalPhase) * 34, y: 527 + Math.sin(pedalPhase) * 34 });
        drawLeg('back', { x: 583, y: 376 + bob }, { x: 630 - Math.cos(pedalPhase) * 34, y: 527 - Math.sin(pedalPhase) * 34 });
        el['bike-shadow'].setAttribute('rx', String(227 - airborne * 42));
        el['bike-shadow'].setAttribute('opacity', String(.16 - airborne * .07));

        const flutter = Math.sin(state.time * 7) * (state.reduced ? 1 : 4.5) * Math.sqrt(state.speed);
        el['scarf-ribbon'].setAttribute('d', `M648 295Q618 ${286 + flutter} 599 ${272 + flutter}L576 ${277 + flutter} 586 ${292 + flutter}Q617 ${301 + flutter} 649 306`);
        el['scarf-line'].setAttribute('d', `M643 298Q618 ${295 + flutter} 592 ${282 + flutter}`);
        const blinkTime = state.time % 5.1;
        const eyeScale = blinkTime > 4.86 ? Math.max(.06, Math.abs(blinkTime - 4.98) / .12) : 1;
        setTransform(el.eye, `translate(700 209) scale(1 ${eyeScale})`);
        setTransform(el['road-lines'], `translate(${-d % 1280} 0)`);
        setTransform(el.shore, `translate(${-(d * .7) % 1280} 0)`);
        setTransform(el.ripples, `translate(${-(d * .15) % 1280} 0)`);
        setTransform(el['distant-land'], `translate(${-(d * .05) % 1280} 0)`);
        setTransform(el.clouds, `translate(${Math.sin(state.time * .06) * 32} ${Math.sin(state.time * .11) * 3})`);
        setTransform(el['sky-birds'], `translate(${Math.sin(state.time * .16) * 22} ${Math.sin(state.time * .35) * 5})`);
        el['speed-strokes'].setAttribute('opacity', String(state.paused ? 0 : clamp((state.speed - .3) * .32, .05, .52)));
        setTransform(el['speed-strokes'], `translate(${Math.sin(state.time * 4) * 8} 0)`);

        const bellTime = (now - state.bellStart) / 1000;
        el['bell-waves'].setAttribute('opacity', String(bellTime < 1.1 ? Math.max(0, (1 - bellTime / 1.1) * (.65 + .35 * Math.sin(bellTime * 24))) : 0));
        setTransform(el['bell-body'], `translate(788 338) rotate(${bellTime < .7 && !state.reduced ? Math.sin(bellTime * 50) * 12 * (1 - bellTime / .7) : 0})`);
        const landing = jumpProgress > .87 && jumpProgress < 1 ? Math.sin((jumpProgress - .87) / .13 * Math.PI) : 0;
        el.dust.setAttribute('opacity', String(landing * .8));
        const target = state.sunset ? 1 : 0;
        themePosition += (target - themePosition) * (state.reduced ? 1 : Math.min(1, dt * 5));
        if (Math.abs(target - themePosition) < .001) themePosition = target;
        setTransform(el['sun-disc'], `translate(${mobileQuery.matches ? -126 : 0} ${themePosition * 164})`);
      }

      function frame(now) {
        raf = null;
        const dt = lastFrame === null ? 0 : Math.min((now - lastFrame) / 1000, .05);
        lastFrame = now;
        if (!state.paused) { state.distance += dt * 255 * state.speed; state.time += dt * state.speed; }
        render(now, dt);
        const effectActive = now - state.jumpStart < 1050 || now - state.bellStart < 1100 || themePosition !== (state.sunset ? 1 : 0);
        if ((!state.paused || effectActive) && !document.hidden) raf = requestAnimationFrame(frame);
      }

      function jump() {
        const now = performance.now();
        if (now - state.jumpStart < 1050) return;
        state.jumpStart = now;
        say('芜湖，海风托我一下！');
        ensureFrame();
      }

      async function ringBell() {
        state.bellStart = performance.now();
        say('叮铃铃，快乐借过！');
        ensureFrame();
        try {
          const Audio = window.AudioContext || window.webkitAudioContext;
          if (!Audio) return;
          audioContext ||= new Audio();
          if (audioContext.state === 'suspended') await audioContext.resume();
          const start = audioContext.currentTime;
          for (const delay of [0, .15]) {
            for (const [frequency, gain] of [[1760, .08], [3523, .025], [4891, .01]]) {
              const oscillator = audioContext.createOscillator();
              const volume = audioContext.createGain();
              oscillator.type = 'sine';
              oscillator.frequency.value = frequency;
              volume.gain.setValueAtTime(0, start + delay);
              volume.gain.linearRampToValueAtTime(gain, start + delay + .004);
              volume.gain.exponentialRampToValueAtTime(.0001, start + delay + .75);
              oscillator.connect(volume); volume.connect(audioContext.destination);
              oscillator.start(start + delay); oscillator.stop(start + delay + .8);
              oscillator.onended = () => { oscillator.disconnect(); volume.disconnect(); };
            }
          }
        } catch (_) { /* The visual bell remains usable when audio is unavailable. */ }
      }

      el['play-button'].addEventListener('click', togglePause);
      $('jump-button').addEventListener('click', jump);
      $('pelican').addEventListener('click', jump);
      $('bell-button').addEventListener('click', ringBell);
      el.speed.addEventListener('input', () => {
        state.speed = Number(el.speed.value);
        el['speed-value'].value = `${state.speed.toFixed(1)}×`;
        el.speed.setAttribute('aria-valuetext', `${state.speed.toFixed(1)} 倍速度`);
        el.speed.style.setProperty('--range-fill', `${(state.speed - .4) / 1.6 * 100}%`);
        ensureFrame();
      });
      el.speed.addEventListener('change', () => say(`骑行速度已设为 ${state.speed.toFixed(1)} 倍`, false));
      $('time-button').addEventListener('click', () => {
        state.sunset = !state.sunset;
        document.body.dataset.time = state.sunset ? 'sunset' : 'day';
        $('time-button').setAttribute('aria-pressed', String(state.sunset));
        $('time-button').setAttribute('aria-label', state.sunset ? '切换为白天景色' : '切换为日落景色');
        $('time-label').textContent = state.sunset ? '回到晴天' : '看场日落';
        document.querySelector('meta[name="theme-color"]').content = state.sunset ? '#f6ece0' : '#f5f5eb';
        say(state.sunset ? '把这一程，骑进落日里。' : '阳光正好，继续兜风。');
        ensureFrame();
      });
      document.addEventListener('keydown', event => {
        if (event.repeat || event.ctrlKey || event.metaKey || event.altKey || event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
        if (event.code === 'Space' && !event.target.closest('button, a')) { event.preventDefault(); togglePause(); }
        else if (event.key.toLowerCase() === 'b') ringBell();
        else if (event.key.toLowerCase() === 'j') jump();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { if (raf !== null) cancelAnimationFrame(raf); raf = null; lastFrame = null; }
        else ensureFrame();
      });
      const setViewport = () => { el.scene.setAttribute('viewBox', mobileQuery.matches ? '330 140 660 550' : '0 0 1280 700'); ensureFrame(); };
      mobileQuery.addEventListener('change', setViewport);
      motionQuery.addEventListener('change', () => {
        state.reduced = motionQuery.matches;
        if (state.reduced) { state.paused = true; updatePlayback(); say('已减少动态效果；点击继续骑行即可播放。', false); }
        ensureFrame();
      });
      setViewport(); updatePlayback(); render(performance.now(), 0);
      if (state.reduced) say('已按系统的减少动态效果设置暂停。点击继续骑行即可播放。', false);
      ensureFrame();
    })();
  </script>
</body>
