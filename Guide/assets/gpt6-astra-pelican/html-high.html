<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const ui = Object.fromEntries(['rider','rear-wheel','front-wheel','crank','near-leg-path','near-leg-color','far-leg-path','near-foot','near-foot-color','far-foot','pedal-front','pedal-back','scarf-tail','clouds','water','distant','plants','road-pattern','shadow','speed-lines','bell-rings','eye-lid','distance','speed','speed-value','pause','pause-text','pause-icon','ride-state','theme','announcement'].map(id=>[id,$(id)]));
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  // Repeat each scenery strip so its wrap point stays outside the viewport.
  for(const [id,width] of [['clouds',1230],['water',1100],['distant',1400],['plants',1330]]){
    const copy=document.createElementNS('http://www.w3.org/2000/svg','g');
    copy.setAttribute('transform',`translate(${width} 0)`);
    for(const child of [...ui[id].children])copy.appendChild(child.cloneNode(true));
    ui[id].appendChild(copy);
  }
  let speed=18, paused=reducedMotion.matches, distance=0, travel=0, elapsed=0, last=0, jumpTime=-1, bellTime=-1, night=false, audioContext;
  function announce(text){ui.announcement.textContent=text;}
  function updatePause(){ui.pause.setAttribute('aria-pressed',String(paused));ui['pause-text'].textContent=paused?'继续骑行':'暂停';ui['pause-icon'].setAttribute('d',paused?'M6 4l10 6-10 6Z':'M7 5v10M13 5v10');ui['ride-state'].textContent=paused?'停下来，看看海':speed===0?'海边小憩':'自在骑行中';}
  function togglePause(){paused=!paused;updatePause();announce(paused?'骑行已暂停':'继续骑行');}
  function jump(){if(jumpTime<0){jumpTime=0;announce('鹈鹕轻轻跳了起来！');}}
  function bell(){
    bellTime=0;announce('叮铃！借过一下。');
    try{audioContext ||= new (window.AudioContext||window.webkitAudioContext)();audioContext.resume().then(()=>{const t=audioContext.currentTime;[0,.14].forEach(delay=>{[1397,2095].forEach((freq,index)=>{const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();oscillator.type='sine';oscillator.frequency.value=freq;gain.gain.setValueAtTime(0,t+delay);gain.gain.linearRampToValueAtTime(index?.028:.08,t+delay+.006);gain.gain.exponentialRampToValueAtTime(.0001,t+delay+.85);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(t+delay);oscillator.stop(t+delay+.9);});});}).catch(()=>{});}catch(error){/* Visual feedback remains available without audio. */}
  }
  ui.pause.addEventListener('click',togglePause);$('jump').addEventListener('click',jump);$('scene').addEventListener('click',jump);$('bell').addEventListener('click',bell);
  ui.speed.addEventListener('input',()=>{speed=Number(ui.speed.value);ui['speed-value'].value=speed;updatePause();});
  ui.theme.addEventListener('click',()=>{night=!night;document.body.classList.toggle('night',night);ui.theme.textContent=night?'☀ 白昼':'☾ 入夜';ui.theme.setAttribute('aria-pressed',String(night));announce(night?'切换到月夜海岸':'切换到白昼海岸');});
  document.addEventListener('keydown',event=>{if(event.repeat||event.ctrlKey||event.metaKey||event.altKey||/INPUT|BUTTON|TEXTAREA|SELECT/.test(event.target.tagName))return;if(event.code==='Space'){event.preventDefault();togglePause();}else if(event.key.toLowerCase()==='b')bell();else if(event.key.toLowerCase()==='j')jump();});
  reducedMotion.addEventListener('change',event=>{if(event.matches){paused=true;updatePause();}});
  document.addEventListener('visibilitychange',()=>{last=0;});
  function attr(id,key,value){ui[id].setAttribute(key,value);}
  function leg(hip,foot,bend){const dx=foot.x-hip.x,dy=foot.y-hip.y,d=Math.hypot(dx,dy),upper=83,lower=86,a=(upper*upper-lower*lower+d*d)/(2*d),h=Math.sqrt(Math.max(0,upper*upper-a*a));const knee={x:hip.x+a*dx/d+bend*h*dy/d,y:hip.y+a*dy/d-bend*h*dx/d};return `M${hip.x} ${hip.y}L${knee.x.toFixed(2)} ${knee.y.toFixed(2)}L${foot.x.toFixed(2)} ${foot.y.toFixed(2)}`;}
  function render(dt){
    const moving=!paused&&speed>0;
    if(!paused){elapsed+=dt;const metres=speed/3.6*dt;distance+=metres/1000;travel+=metres*78;}
    const wheelAngle=travel/99,phase=wheelAngle/2.35,deg=wheelAngle*180/Math.PI;
    attr('rear-wheel','transform',`rotate(${deg%360})`);attr('front-wheel','transform',`rotate(${deg%360})`);attr('crank','transform',`translate(527 462) rotate(${phase*180/Math.PI%360})`);
    const front={x:527+31*Math.cos(phase),y:462+31*Math.sin(phase)},back={x:527-31*Math.cos(phase),y:462-31*Math.sin(phase)};
    const near=leg({x:508,y:315},{x:front.x-7,y:front.y-9},1);attr('near-leg-path','d',near);attr('near-leg-color','d',near);attr('far-leg-path','d',leg({x:478,y:313},{x:back.x-6,y:back.y-8},-1));
    attr('near-foot','d',`M${front.x-10} ${front.y-7}h29`);attr('near-foot-color','d',`M${front.x-10} ${front.y-8}h29`);attr('far-foot','d',`M${back.x-10} ${back.y-7}h28`);attr('pedal-front','d',`M${front.x-10} ${front.y+2}h29`);attr('pedal-back','d',`M${back.x-10} ${back.y+2}h29`);
    let lift=0;if(jumpTime>=0){jumpTime+=dt;const p=Math.min(1,jumpTime/.85);lift=Math.sin(p*Math.PI)*68;if(p===1)jumpTime=-1;}
    const bob=moving?Math.sin(phase*2)*1.8:0;attr('rider','transform',`translate(0 ${bob-lift})`);attr('shadow','rx',241-lift*.7);attr('shadow','opacity',.14-lift*.0008);
    attr('scarf-tail','transform',`rotate(${moving?Math.sin(elapsed*(5+speed*.15))*5:0} 539 208)`);
    attr('clouds','transform',`translate(${-travel*.045%1230} 0)`);attr('water','transform',`translate(${-travel*.19%1100} 0)`);attr('distant','transform',`translate(${-travel*.06%1400} 0)`);attr('plants','transform',`translate(${-travel%1330} 0)`);attr('road-pattern','patternTransform',`translate(${-travel%180} 0)`);attr('speed-lines','opacity',moving?Math.max(0,(speed-23)/40):0);
    attr('eye-lid','opacity',elapsed%4.8>4.6?1:0);
    if(bellTime>=0){bellTime+=dt;attr('bell-rings','opacity',Math.max(0,1-bellTime/1.1));if(bellTime>1.1)bellTime=-1;}
    ui.distance.textContent=distance.toFixed(2);
  }
  function frame(now){if(!last)last=now;const dt=Math.min((now-last)/1000,.05);last=now;if(!document.hidden)render(dt);requestAnimationFrame(frame);}
  updatePause();render(0);requestAnimationFrame(frame);
})();
</script>
